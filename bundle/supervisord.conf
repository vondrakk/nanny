[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:blackbox]
command=/usr/local/bin/blackbox_exporter --config.file=/etc/nanny/blackbox.yml --web.listen-address=:9115
user=nanny
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:prometheus]
command=/usr/local/bin/prometheus --config.file=/etc/nanny/prometheus.yml --storage.tsdb.path=/data/prometheus --web.listen-address=:9090
user=nanny
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:alertmanager]
command=/usr/local/bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/data/alertmanager --web.listen-address=:9093
user=nanny
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The LLM triage brain. Needs Slack + Anthropic env; if unset it will restart —
; comment this block out if you only want the monitoring substrate.
[program:nanny]
command=python /app/nanny.py server
user=nanny
environment=NANNY_DATA_DIR="/data",HOME="/home/nanny"
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
