{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nanny.fullname" . }}-secrets
  labels:
    {{- include "nanny.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.auth.mode "password" }}
  {{- if not .Values.auth.password }}
  {{- fail "auth.mode=password requires auth.password (set via --set or use existingSecret)" }}
  {{- end }}
  NANNY_AUTH_PASSWORD: {{ .Values.auth.password | quote }}
  {{- end }}
  {{- with .Values.webhookToken }}
  NANNY_WEBHOOK_TOKEN: {{ . | quote }}
  {{- end }}
  {{- if and (eq .Values.llm.backend "anthropic") .Values.llm.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
